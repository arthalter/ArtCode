rules:
  - id: system-root-delete
    regex: '(?i)(?:^|[;&|]\s*)rm\s+(?:-[^\s]*r[^\s]*f|-[^\s]*f[^\s]*r)\s+(?:--\s+)?/(?:\s|$)'
    reason: 禁止递归强制删除系统根目录
  - id: disk-format
    regex: '(?i)(?:^|[;&|]\s*)(?:mkfs(?:\.\w+)?|newfs_\w+)\b'
    reason: 禁止格式化磁盘或文件系统
  - id: disk-device-write
    regex: '(?i)\bdd\b[^\n;&|]*\bof\s*=\s*/dev/(?:r?disk|sd)\w*'
    reason: 禁止直接写入磁盘设备
  - id: disk-redirection
    regex: '(?i)>\s*/dev/(?:r?disk|sd)\w*'
    reason: 禁止重定向覆盖磁盘设备
  - id: root-permission-destruction
    regex: '(?i)(?:^|[;&|]\s*)chmod\s+-R\s+777\s+/(?:\s|$)'
    reason: 禁止破坏系统根目录权限
  - id: fork-bomb
    regex: ':\s*\(\s*\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:'
    reason: 禁止执行 fork bomb
  - id: remote-script-pipe
    regex: '(?i)\b(?:curl|wget)\b[^\n|]*\|\s*(?:sh|bash|zsh|ksh)\b'
    reason: 禁止把远程脚本直接管道到 Shell
  - id: git-reset-hard
    regex: '(?i)(?:^|[;&|]\s*)git\s+reset\s+--hard(?:\s|$)'
    reason: 禁止强制丢弃 Git 工作区修改
  - id: git-clean-force
    regex: '(?i)(?:^|[;&|]\s*)git\s+clean\s+-[^\s]*f'
    reason: 禁止强制清理 Git 未跟踪文件
  - id: git-whole-tree-restore
    regex: '(?i)(?:^|[;&|]\s*)git\s+(?:restore|checkout)\s+(?:--\s+)?\.(?:\s|$)'
    reason: 禁止整体还原 Git 工作区
  - id: macos-diskutil
    regex: '(?i)(?:^|[;&|]\s*)diskutil\s+(?:erase|partition|zeroDisk|secureErase)\w*\b'
    reason: 禁止使用 diskutil 擦除或重分区磁盘
