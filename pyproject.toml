[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artcode"
version = "0.2.0"
description = "A local CLI coding agent learning project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7.0",
  "mcp>=1.28,<2",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.100.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
artcode = "artcode.cli:main"

[tool.setuptools.packages.find]
include = ["artcode*"]

[tool.setuptools.package-data]
"artcode.security" = ["*.yml"]
"artcode.sandbox" = ["*.sb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ch10_5: scenarios added for the ch10.5 summary refactor",
  "live: uses a real external service or operating-system integration",
  "slow: intentionally long-running verification",
  "property: randomized or generative invariant verification",
  "fault: deterministic failure-injection verification",
  "soak: repeated lifecycle or resource-stability verification",
]
